title: '[Idea] '
body:
  - type: markdown
    attributes:
      value: |
        先说问题，再说方案——这样更容易讨论。

        提新能力之前请先过一遍 [`docs/roadmap.md`](https://github.com/baiwumm/vue3-okr-tree/blob/main/docs/roadmap.md)
        的「已决定不做」一节；已经明确否掉的方案仍欢迎重提，但要带上新的证据或新的使用场景。
  - type: dropdown
    id: area
    attributes:
      label: 想法属于哪块
      options:
        - 对外 API（props / events / methods / 插槽）
        - 渲染与布局（连线、根对齐、多树对齐）
        - 交互与无障碍（拖拽、勾选、键盘）
        - 懒加载与虚拟滚动
        - 画布缩放与导出（OkrTreeViewport）
        - 主题与 CSS 变量
        - 文档站与 Playground
        - 工程与 DX
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 你今天遇到的具体场景，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 尤其是「不改库、用现有的 props 或插槽能不能表达同一个效果」。
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 参考实现、录屏、相关 issue。
  - type: checkboxes
    id: checks
    attributes:
      label: 发帖前确认
      options:
        - label: 我检索过已有讨论与文档站。
          required: true
        - label: 我读过 `docs/roadmap.md` 的「已决定不做」清单，这个想法不在其中（或在清单里但我有新证据）。
          required: true
        - label: 这是一条想法，不是打包在一起的几条。
          required: true
