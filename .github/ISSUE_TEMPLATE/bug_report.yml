name: 🐞 Bug report
description: 报告一个可复现的问题（渲染、展开收起、拖拽、勾选、懒加载、虚拟滚动、画布导出或文档站）
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这个表单只收**可复现的 bug**；安装与使用问题请先看[文档站](https://vue3-okr-tree.baiwumm.com)，安全问题走[私密报告](https://github.com/baiwumm/vue3-okr-tree/security/advisories/new)。

        观感类问题（连线位置、根对齐偏移、展开收起抖动、主题配色）同样欢迎开 issue——它们是 roadmap 的输入，只是不算安全漏洞。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 核心组件（vue3-okr-tree）
        - 画布缩放与导出（OkrTreeViewport）
        - 多树对齐（OkrTreeGroup）
        - 懒加载（lazy / load）
        - 虚拟滚动（virtual）
        - 主题与 CSS 变量（--okr-* / unstyled）
        - 键盘导航与无障碍
        - 类型声明 / 包导出 / 构建产物
        - 文档站与 Playground
        - 其它
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 库版本（`pnpm ls vue3-okr-tree` 或 package.json）与 Vue 版本。
      placeholder: vue3-okr-tree 1.17.0 · vue 3.5.22
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: 触发场景
      options:
        - 初次渲染
        - 展开 / 收起
        - 勾选 / 半选（父子联动）
        - 拖拽调整层级
        - 过滤（filter）
        - 懒加载子节点
        - 虚拟滚动
        - 画布缩放 / 平移 / 导出
        - 键盘导航
        - 文档站页面
        - 其它
    validations:
      required: true
  - type: input
    id: props
    attributes:
      label: 相关 props 与数据
      description: 出问题时的关键 props（direction / onlyBothTree / virtual / lazy / connector 等）与节点数据形状，几行 JSON 就够。
      placeholder: direction="horizontal" · only-both-tree · virtual · node-key="id" · 节点数 ≈ 2000
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最好能给最小复现（Playground 里改 data，或一段可运行的代码片段）。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际
      description: 预期行为、实际行为，以及控制台的完整报错（含警告）。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 取证材料
      description: 截图或录屏链接、控制台输出、节点数据规模。视觉问题请说明是哪种布局与哪一步之后出现的。
      placeholder: 截图 / 录屏链接 · 控制台报错 · 节点数与层级深度
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue、讨论区与文档站。
          required: true
        - label: 我已在 Playground 或最小复现里确认过，不依赖业务页面的其它样式。
          required: true
        - label: 帖子里没有真实站点的 token、内部地址或用户数据。
          required: true
