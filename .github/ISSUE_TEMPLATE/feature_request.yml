name: 💡 Feature request
description: 提议一个新能力或改进（参数面、交互、主题、虚拟滚动、导出、文档与 DX）
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        仍然欢迎的方向：参数面扩展（新 props / 事件 / 插槽）、交互与无障碍、主题能力、
        大数据量（懒加载 / 虚拟滚动）体验、画布导出、文档站与 Playground 的开发体验。

        提新能力之前请先过一遍 [`docs/roadmap.md`](https://github.com/baiwumm/vue3-okr-tree/blob/main/docs/roadmap.md)
        的「已决定不做」一节——已经明确否掉的方案，重提时请带上新的证据。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 参数面（props / events / methods / 插槽）
        - 渲染与布局（连线、根对齐、多树）
        - 交互与无障碍（拖拽、勾选、键盘）
        - 懒加载与虚拟滚动
        - 画布缩放与导出（OkrTreeViewport）
        - 主题与 CSS 变量
        - API / 类型声明
        - 文档站与 Playground
        - 工程与 DX（构建、类型、测试）
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说场景，再说方案——现在卡在哪里、还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
      description: 如果涉及对外 API，请写清 props 的取值语义、默认值与非法值的处理方式；本库对非法值一律静默回落到默认值，不抛错。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括「不改库、用现有的 props 或插槽能不能凑出来」。
  - type: textarea
    id: context
    attributes:
      label: 其它上下文
      description: 截图、录屏、相关 issue 或外部实现链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我读过 `docs/roadmap.md` 的「已决定不做」，这个提案不在其中（或在清单里但我有新证据）。
          required: true
        - label: 这是一条请求，不是多个请求捆在一起。
          required: true
        - label: 我已搜索过现有 issue 与讨论区，没有重复的提案。
          required: true
