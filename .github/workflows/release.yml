name: Release

# 发布流程（roadmap 1.5.0 #4）：推送 v* tag 后自动构建、校验并发包。
#
# 前置（一次性，由维护者手动完成）：
#   1. npmjs.com 包页面 → Settings → Trusted Publisher → 登记仓库 baiwumm/vue3-okr-tree +
#      workflow 文件名 release.yml（OIDC 免密发布，无需任何 token / GitHub Secrets；
#      npm 已宣布 2027-01 起 granular token 不能再直接发包）
#   2. CI 里 npm 需 ≥ 11.5.1（下方有显式升级步；setup-node 的 Node 22 自带 npm 10.x）
#
# 日常发布：更新 package.json version 与 CHANGELOG → 提交 → git tag v1.x.x && git push origin v1.x.x
# 版本基准：本包是版本决策点，react-okr-tree 同号锁步跟随（两个仓库各自打 v* tag 发包）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance（OIDC）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify & Publish
    runs-on: ubuntu-latest
    # 全部门禁正常 ~3 分钟；卡死时强制失败，避免 tag 发布被无限占住
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: node -e "const p=require('./package.json'); const t=process.env.GITHUB_REF_NAME.slice(1); if(p.version!==t){console.error('package.json version '+p.version+' != tag '+t);process.exit(1)}"

      - name: Lint / Typecheck / Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build & verify dist
        run: |
          pnpm build
          pnpm verify:dist
          pnpm verify:package
          pnpm size

      # Trusted Publishing：身份走 OIDC（permissions.id-token: write），要求 npm ≥ 11.5.1
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      # 手动首发过的版本（如 1.13.0）再推 tag 时跳过发布，而不是撞 EPUBLISHCONFLICT 把整条
      # 链路弄红——后面的 gh release create 仍能把 GitHub Release 补上。
      # npm view 查不存在的版本会以非零码退出，故失败方向是安全的：误判成「未发布」只会
      # 照常尝试发布并大声报错，不会静默跳过一次真实发布。
      - name: Check whether this version is already on npm
        id: npm_published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION 已存在于 npm，跳过 publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing, no token)
        if: steps.npm_published.outputs.exists == 'false'
        run: npm publish --provenance --access public

      # Release 正文取 CHANGELOG 里本版本的那一段。不用 --generate-notes：它靠合并的 PR 列表
      # 生成摘要，而本仓库直推 main 没有 PR，结果就只剩一行 compare 链接（1.14.0 首发时实测过）。
      # 标题有两种写法（`## 1.14.0（2026-09-22）` 与 `## 1.13.0`），故按前缀匹配。
      # 取不到段落时退回自动生成，不让发布链路变红。
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          node -e '
            const fs = require("node:fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const head = new RegExp("^##\\s*" + v.replace(/\./g, "\\.") + "(?![\\d.])");
            const start = lines.findIndex((l) => head.test(l.trim()));
            let body = "";
            if (start >= 0) {
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i += 1) {
                if (/^##\s/.test(lines[i])) { end = i; break; }
              }
              body = lines.slice(start, end).join("\n").trim();
            }
            if (body) {
              fs.writeFileSync("/tmp/release-notes.md", body + "\n");
              console.log("Release 正文取 CHANGELOG 的 " + v + " 段（" + body.split("\n").length + " 行）");
            } else {
              console.log("::notice::CHANGELOG 没有 " + v + " 段，退回 --generate-notes");
            }
          '
          if [ -s /tmp/release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        run: |
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
