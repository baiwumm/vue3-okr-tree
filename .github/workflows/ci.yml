name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      # 单条矩阵项失败不连带取消其余项，便于一次看清所有 Node 版本的真实结果
      fail-fast: false
      matrix:
        # pnpm 11 依赖 node:sqlite（Node ≥22.5），在 Node 20 上 setup-node 的 pnpm 缓存步骤直接崩
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Coverage (thresholds in vite.config.ts)
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Verify dist
        run: pnpm verify:dist

      - name: Package checks (publint + attw)
        run: pnpm verify:package

      - name: Size budget (size-limit)
        run: pnpm size

      - name: Build playground against dist
        run: PLAYGROUND_USE_DIST=1 pnpm build:playground

      - name: Pack (dry run)
        run: npm pack --dry-run

  peer-matrix:
    name: Unit tests on vue ${{ matrix.vue }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # roadmap #16：peer 范围实测（defineSlots 需要编译器 ≥3.3，已声明 vue >=3.3.0）。
        # 矩阵腿用 pnpm overrides 钉 vue 与 @vue/test-utils 的兼容组合：
        # test-utils ≥2.4 依赖 vue ≥3.5 的 app.onUnmount，vue <3.5 的腿必须配 test-utils ~2.3。
        include:
          - vue: '~3.3.0'
            test-utils: '~2.3.2'
          - vue: '~3.4.0'
            test-utils: '~2.3.2'
          - vue: '~3.5.0'
            test-utils: '~2.5.1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Pin vue@${{ matrix.vue }} + @vue/test-utils@${{ matrix.test-utils }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.pnpm={...p.pnpm,overrides:{...((p.pnpm||{}).overrides||{}),vue:'${{ matrix.vue }}','@vue/test-utils':'${{ matrix.test-utils }}'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Assert resolved versions
        run: node -e "console.log('vue', require('vue/package.json').version, '| @vue/test-utils', require('@vue/test-utils/package.json').version)"

      - name: Unit & component tests
        run: pnpm test
