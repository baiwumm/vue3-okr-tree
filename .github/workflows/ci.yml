name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      # 单条矩阵项失败不连带取消其余项，便于一次看清所有 Node 版本的真实结果
      fail-fast: false
      matrix:
        # pnpm 11 依赖 node:sqlite（Node ≥22.5），在 Node 20 上 setup-node 的 pnpm 缓存步骤直接崩
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Coverage (thresholds in vite.config.ts)
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Verify dist
        run: pnpm verify:dist

      - name: Package checks (publint + attw)
        run: pnpm verify:package

      - name: Size budget (size-limit)
        run: pnpm size

      - name: Build playground against dist
        run: PLAYGROUND_USE_DIST=1 pnpm build:playground

      - name: Pack (dry run)
        run: npm pack --dry-run

  # 文档站与库同仓、依赖打在根 lockfile 上，不构建就抓不到 Nuxt/Docus 侧的回归。
  # 跑的是线上部署（腾讯云 EdgeOne）用的同一条命令（docs:build:full：库 dist + Playground +
  # nuxt generate + 合并 /playground/），而不是只跑 generate —— 部署链路吃的是完整产物。
  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 只在生产环境暴露的平台侧行为，本地复现不了：根 package.json 一旦重新出现 nuxt / next，
      # EdgeOne 就会构建"成功"但产物为空。断言逻辑与来龙去脉见 scripts/verify-edgeone-output.mjs。
      - name: Assert EdgeOne will be able to collect the output
        run: pnpm verify:edgeone

      - name: Build docs site + playground (same command as the EdgeOne build)
        run: pnpm docs:build:full

      - name: Assert the static output deployed to EdgeOne
        run: |
          test -f docs-site/.output/public/index.html
          test -f docs-site/.output/public/playground/index.html
          test -f docs-site/.output/public/404.html

  peer-matrix:
    name: Unit tests on vue ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.16.0 之后 peer 下限收紧到 3.5.2（产物 d.ts 依赖 3.5 的公开类型，
        # 3.3 / 3.4 / 3.5.0 / 3.5.1 实测都无法通过 verify:peer-types）。
        # 只留两条腿：声明的下限（3.5.2，跑单测 + build + 消费者 d.ts）与 devDependencies 当前版本。
        # 下限腿用 pnpm overrides 钉 vue 与 @vue/test-utils；test-utils ≥2.5 依赖 vue 3.5 的 app.onUnmount。
        include:
          - label: '3.5.2 (peer 下限)'
            vue: '3.5.2'
            test-utils: '~2.5.1'
            pin: true
          - label: 'dev (当前开发版本)'
            pin: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Pin peer leg versions (vue ${{ matrix.vue || 'dev' }})
        if: matrix.pin
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.pnpm={...p.pnpm,overrides:{...((p.pnpm||{}).overrides||{}),vue:'${{ matrix.vue }}','@vue/test-utils':'${{ matrix.test-utils }}'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Assert resolved versions
        run: node -e "console.log('vue', require('vue/package.json').version, '| @vue/test-utils', require('@vue/test-utils/package.json').version)"

      - name: Unit & component tests
        run: pnpm test

      # 下限腿把「声明的下限」直接编译一遍产物的 d.ts：下限若与类型能力脱节，这里就会红。
      - name: Build library
        if: matrix.pin
        run: pnpm build

      - name: Consumer d.ts typecheck (peer lower bound)
        if: matrix.pin
        run: pnpm verify:peer-types
