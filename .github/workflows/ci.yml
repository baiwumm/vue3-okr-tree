name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      # 单条矩阵项失败不连带取消其余项，便于一次看清所有 Node 版本的真实结果
      fail-fast: false
      matrix:
        # pnpm 11 依赖 node:sqlite（Node ≥22.5），在 Node 20 上 setup-node 的 pnpm 缓存步骤直接崩
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Coverage (thresholds in vite.config.ts)
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Verify dist
        run: pnpm verify:dist

      - name: Package checks (publint + attw)
        run: pnpm verify:package

      - name: Size budget (size-limit)
        run: pnpm size

      - name: Build playground against dist
        run: PLAYGROUND_USE_DIST=1 pnpm build:playground

      - name: Pack (dry run)
        run: npm pack --dry-run
