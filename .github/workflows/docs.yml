name: Deploy Docs

# 文档站部署（roadmap 1.5.0 #3）：main 推送后构建 VitePress 并发布到 GitHub Pages。
# 首次启用：仓库 Settings → Pages → Source 选择 "GitHub Actions"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy VitePress
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm docs:build

      # Playground（引用 dist 产物构建）随文档站一并发布到 /playground/ 子路径
      - name: Build playground against dist
        run: PLAYGROUND_USE_DIST=1 pnpm build:playground

      - name: Merge playground into Pages output
        run: cp -r playground/dist docs-site/.vitepress/dist/playground

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
