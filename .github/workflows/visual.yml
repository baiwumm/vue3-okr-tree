name: Visual Regression

# 视觉回归（roadmap 1.5.0 #5）：独立 job，真实浏览器截图比对 Playground 关键用例。
# 失败时上传 diff 图与报告，便于定位像素级回归（改 CSS 变量 / 连接线时捕捉）。
#
# runner 镜像固定：Linux 基线（*-chromium-linux.png）由系统字体渲染决定，
# ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26，届时全部基线会集体失配。
# 若要换镜像，必须先用 snapshot-bootstrap.yml 重新生成并提交 Linux 基线。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright Visual · Perf
    runs-on: ubuntu-24.04
    # 正常全套 ~2 分钟；曾出现过测试步骤挂起 2 小时（每用例 30s 超时管不住步骤级挂死），
    # 兜底 20 分钟强制失败并放出日志与截图 artifact
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build library
        run: pnpm build

      - name: Build playground against dist
        run: PLAYGROUND_USE_DIST=1 pnpm build:playground

      - name: Visual & perf tests
        run: pnpm test:visual

      - name: Upload diff & report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
