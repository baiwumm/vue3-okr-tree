<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 相对路径：base 为 './'，合并进文档站 /playground/ 子路径后仍可解析（源文件 playground/public/） -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <title>vue3-okr-tree · Demo</title>
    <!-- Playground 是 Vite 客户端渲染的试验场：静态 HTML 里只有一个空的 #app，
         对爬虫就是一页空白。它没有独立搜索价值（价值在于「能上手玩」），
         所以 noindex，只保留 follow 让它能传递站内链接权重。 -->
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
