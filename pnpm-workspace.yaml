# 文档站是独立的 workspace 包：nuxt / docus 只声明在它自己的 package.json 里。
# EdgeOne 构建机会读根 package.json 的依赖字段来识别框架，命中 nuxt 就会跳过
# 「把输出目录搬进上传暂存区」这步，控制台的输出目录于是完全不生效。
packages:
  - 'docs-site'

allowBuilds:
  esbuild: true
  better-sqlite3: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@types/node@24.13.5'
  - '@vue/test-utils@2.5.1'
  - prettier@3.9.7
# vite 7 仍在库构建链路中使用，豁免 pnpm 供应链策略的降级检查
trustPolicyExclude:
  - vite
