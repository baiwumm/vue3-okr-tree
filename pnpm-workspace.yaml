allowBuilds:
  esbuild: true
  better-sqlite3: true
  vue-demi: set this to true or false
minimumReleaseAgeExclude:
  - '@types/node@24.13.5'
  - '@vue/test-utils@2.5.1'
  - prettier@3.9.7
# vitepress 1.x 依赖 vite@5.4.21（provenance 晚于早期 trusted publisher 记录），
# 属已知的历史版本，豁免 pnpm 供应链策略的降级检查
trustPolicyExclude:
  - vite
